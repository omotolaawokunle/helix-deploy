x-api-image: &api-image
  image: helixdeploy-api:latest

x-api-service: &api-service
  <<: *api-image
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    - api
    - redis
  networks:
    - internal
    - observability
  restart: unless-stopped

services:
  api:
    <<: *api-image
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - observability
    restart: unless-stopped
    volumes:
      - api_storage:/var/www/html/storage

  worker-deployments:
    <<: *api-service
    command: >
      php artisan queue:work redis
      --queue=deployments
      --sleep=3
      --tries=1
      --timeout=1800
      --max-time=3600

  worker-builds:
    <<: *api-service
    command: >
      php artisan queue:work redis
      --queue=builds
      --sleep=3
      --tries=1
      --timeout=1800
      --max-time=3600

  worker-provisioning:
    <<: *api-service
    command: >
      php artisan queue:work redis
      --queue=provisioning
      --sleep=3
      --tries=1
      --timeout=1800
      --max-time=3600

  worker-default:
    <<: *api-service
    command: >
      php artisan queue:work redis
      --queue=commands,monitoring,default
      --sleep=3
      --tries=3
      --timeout=120
      --max-time=3600

  scheduler:
    <<: *api-service
    command: php artisan schedule:work

  reverb:
    <<: *api-service
    # No host port publish — browsers connect via frontend nginx /app/ → reverb:8080.
    # For a direct host bind in local setups, add a compose override with ports: ["8080:8080"].
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
    # Default binds loopback so a host reverse proxy can terminate TLS.
    # Bare metal without a proxy: FRONTEND_PUBLISH_BIND=0.0.0.0 FRONTEND_PUBLISH_PORT=80
    ports:
      - "${FRONTEND_PUBLISH_BIND:-127.0.0.1}:${FRONTEND_PUBLISH_PORT:-8085}:80"
    depends_on:
      - api
      - reverb
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_storage:

networks:
  internal:
    driver: bridge
  observability:
    external: true
    name: observability_net
